[package]
name = "forge-cli"
version = "0.1.0"
edition = "2021"
description = "Forge CLI — stateless code stamping compiler. Reads .missiond/*.lisp, generates Rust."

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
nc-parser = { git = "https://github.com/RuoqiJin/neural-codegen.git", rev = "8011b99" }
nc-jarvis-ir = { path = "../nc-jarvis-ir" }
nc-jarvis-gen = { path = "../nc-jarvis-gen" }
forge-core = { path = "../forge-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
